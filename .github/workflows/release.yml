name: Release npm package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @pomepitech/ordo
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          test "$RELEASE_TAG" = "$EXPECTED_TAG" || {
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION (expected $EXPECTED_TAG)" >&2
            exit 1
          }

      - name: Verify package
        run: |
          pnpm lint
          pnpm build
          pnpm typecheck
          pnpm --filter @pomepitech/ordo test

      - name: Publish package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./packages/cli --access public --provenance
